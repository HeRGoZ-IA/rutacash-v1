<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Instalar ADEX · Manual</title>
<style>
:root{
  --blue:#2563eb;--blue2:#1d4ed8;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--bg:#f1f5f9;--card:#fff;
  --green:#059669;--red:#dc2626;--amber:#d97706;--soft:#eff6ff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 16px;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff}
.top .logo{font-weight:900;font-size:20px;letter-spacing:1px}
.top .ttl{font-size:14px;opacity:.9;flex:1;line-height:1.2}
.lang{display:flex;background:rgba(255,255,255,.18);border-radius:999px;padding:3px}
.lang button{padding:5px 11px;border-radius:999px;font-weight:700;font-size:13px;color:#fff}
.lang button.on{background:#fff;color:var(--blue)}
/* ---------- MENÚ ---------- */
#menu{max-width:720px;margin:0 auto;padding:16px 16px 40px}
.hero{background:#fff;border-radius:20px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:16px;display:flex;gap:14px;align-items:center}
.hero img{width:64px;height:64px;border-radius:16px;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.hero h1{font-size:22px;margin-bottom:6px}
.hero p{color:var(--mut);font-size:15px;line-height:1.45}
.sec{margin:22px 0 10px;font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sec small{font-weight:500;color:var(--mut);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.task{background:#fff;border-radius:16px;padding:14px;text-align:left;box-shadow:0 1px 3px rgba(0,0,0,.06);border:2px solid transparent;display:flex;flex-direction:column;gap:6px;min-height:104px}
.task:active,.task:hover{border-color:var(--blue)}
.task .ic{font-size:28px}
.task b{font-size:15px;line-height:1.25}
.task span{font-size:12.5px;color:var(--mut);line-height:1.3}
.open{display:flex;flex-direction:column;gap:8px;background:#fff;border-radius:18px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:6px}
.open a.go{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--blue);color:#fff;text-decoration:none;font-weight:800;font-size:17px;padding:14px;border-radius:14px}
.open a.go:active{background:var(--blue2)}
.open .addr{text-align:center;font-size:14px;color:var(--mut)}
.open .addr b{color:var(--ink);user-select:all}
.open .wa{font-size:13px;line-height:1.45;color:#92400e;background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:8px 10px}
.gain{background:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 1px 3px rgba(0,0,0,.06);font-size:14.5px;line-height:1.5}
.gain li{margin-left:18px;margin-bottom:4px}
.faq details{background:#fff;border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:8px;overflow:hidden}
.faq summary{padding:13px 16px;font-weight:700;font-size:15px;cursor:pointer;list-style:none;display:flex;gap:8px;align-items:flex-start}
.faq summary::-webkit-details-marker{display:none}
.faq summary::before{content:"▸";color:var(--blue);transition:transform .2s}
.faq details[open] summary::before{transform:rotate(90deg)}
.faq .ans{padding:0 16px 14px 34px;font-size:14.5px;line-height:1.5;color:#334155}
.faq .ans b{color:var(--ink)}
.tip{background:#fffbeb;border:1px solid #fde68a;border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.45;margin-top:14px}
code{background:#eef2ff;border-radius:6px;padding:1px 6px;font-size:.95em}
/* ---------- REPRODUCTOR ---------- */
#player{display:none;flex-direction:column;height:calc(100dvh - 52px);max-width:720px;margin:0 auto}
#player.on{display:flex}
.pbar{display:flex;align-items:center;gap:8px;padding:8px 12px}
.pbar .back{background:#fff;border-radius:999px;padding:7px 12px;font-weight:700;font-size:14px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.pbar .name{font-weight:800;font-size:15px;flex:1;line-height:1.2}
.stagewrap{flex:1;min-height:0;display:flex;justify-content:center;align-items:flex-start;padding:0 8px}
.stage{position:relative;border-radius:18px;overflow:hidden;box-shadow:0 8px 30px rgba(15,23,42,.18);background:#000}
.cap{background:#fff;border-radius:18px 18px 0 0;padding:12px 16px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(0,0,0,.06)}
.prog{display:flex;gap:4px;margin-bottom:8px}
.prog i{flex:1;height:5px;border-radius:9px;background:var(--line)}
.prog i.pd{background:#93c5fd}.prog i.pc{background:var(--blue)}
.stepn{font-size:12px;color:var(--mut);font-weight:700;margin-bottom:3px}
.txt{font-size:16.5px;line-height:1.42;min-height:3.2em}
.txt b{color:var(--blue2)}
.ctrls{display:flex;gap:8px;margin-top:10px}
.ctrls button{flex:1;padding:11px 6px;border-radius:12px;background:var(--soft);color:var(--blue2);font-weight:800;font-size:15px}
.ctrls button.main{background:var(--blue);color:#fff;flex:1.4}
.done{position:absolute;inset:0;z-index:60;background:rgba(15,23,42,.72);display:flex;align-items:center;justify-content:center;padding:24px}
.done div{background:#fff;border-radius:20px;padding:22px;text-align:center;max-width:300px}
.done .big{font-size:46px}
.done h3{margin:6px 0 8px;font-size:20px}
.done p{color:var(--mut);font-size:15px;line-height:1.4;margin-bottom:14px}
.done button{display:block;width:100%;padding:12px;border-radius:12px;font-weight:800;margin-top:8px;background:var(--soft);color:var(--blue2)}
.done button.main{background:var(--blue);color:#fff}
@media (min-width:900px){
  #player{flex-direction:row;flex-wrap:wrap;align-content:flex-start;max-width:900px}
  .pbar{width:100%}
  .stagewrap{flex:0 0 auto;padding:0 16px}
  .cap{flex:1;border-radius:18px;margin-right:16px;align-self:flex-start}
  #player.wide{flex-direction:column;flex-wrap:nowrap}
  #player.wide .stagewrap{flex:0 0 auto}
  #player.wide .cap{flex:0 0 auto;margin:12px 16px 0;border-radius:18px;align-self:stretch}
}

/* ================= DISPOSITIVOS SIMULADOS ================= */
.app{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;font-size:13px;color:#111827;background:#fff}
.app img.ai{width:100%;height:100%;display:block;border-radius:inherit}
/* barra de estado del celular */
.sb{position:absolute;left:0;right:0;top:0;height:26px;display:flex;justify-content:space-between;align-items:center;padding:0 16px;font-size:11.5px;font-weight:700;z-index:3}
.sb.lt{color:#fff}.sb.dk{color:#111}
/* fondo y escritorio del celular */
.wall{position:absolute;inset:0}
.wall.and{background:linear-gradient(165deg,#0f766e 0%,#1e3a8a 70%)}
.wall.ios{background:linear-gradient(165deg,#7c3aed 0%,#2563eb 55%,#0ea5e9 100%)}
.icons{position:absolute;left:16px;right:16px;top:58px;display:grid;grid-template-columns:repeat(4,1fr);row-gap:20px}
.dock{position:absolute;left:14px;right:14px;bottom:18px;display:grid;grid-template-columns:repeat(4,1fr);padding:12px 4px;border-radius:26px}
.dock.ios{background:rgba(255,255,255,.28)}
.aic{display:flex;flex-direction:column;align-items:center;gap:5px;justify-self:center;border-radius:14px}
.aic i{width:54px;height:54px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:26px;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.and .aic i,.aic.round i{border-radius:50%}
.aic span{font-size:11px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5);max-width:72px;text-align:center;line-height:1.1}
.aic.new i{animation:pop .7s ease}
@keyframes pop{0%{transform:scale(.2);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.toastp{position:absolute;left:24px;right:24px;bottom:110px;background:rgba(17,24,39,.92);color:#fff;border-radius:12px;padding:10px 12px;font-size:12px;text-align:center;z-index:5}
/* página de ADEX (inicio de sesión) */
.lg{position:absolute;left:0;right:0;background:linear-gradient(160deg,#1e3a8a,#2563eb);padding:34px 20px;display:flex;flex-direction:column;align-items:center}
.lg .bi{width:64px;height:64px;border-radius:16px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.lg b.n{color:#fff;font-size:28px;font-style:italic;font-weight:900;letter-spacing:1px;margin-top:8px}
.lg span.s{color:#dbeafe;font-size:11px;margin-bottom:18px}
.lg .card{background:#fff;border-radius:16px;padding:14px;width:100%;max-width:300px}
.lg .card label{display:block;font-size:11px;font-weight:700;color:#374151;margin:6px 0 3px}
.lg .card .in{border:1.5px solid #d1d5db;border-radius:10px;height:34px}
.lg .card .bt{margin-top:12px;background:var(--blue);color:#fff;border-radius:10px;text-align:center;font-weight:800;padding:9px}
.lg.mini{padding:16px 20px}
.lg.mini .bi{width:44px;height:44px;border-radius:12px}
.lg.mini b.n{font-size:20px;margin-top:4px}
.lg.mini span.s{margin-bottom:8px}
.lg.mini .card{max-width:240px;padding:10px}
.lg.mini .card .in{height:24px}
.lg.mini .card .bt{padding:6px;margin-top:8px}
/* Chrome Android */
.cbar{position:absolute;left:0;right:0;top:26px;height:52px;display:flex;align-items:center;gap:8px;padding:0 8px;background:#fff;border-bottom:1px solid #e5e7eb;z-index:2}
.cbar .hm,.cbar .tb,.cbar .dt{width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:17px;color:#374151;border-radius:50%}
.cbar .tb span{width:18px;height:18px;border:2px solid #374151;border-radius:4px;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center}
.url{flex:1;height:36px;border-radius:999px;background:#f1f3f4;display:flex;align-items:center;gap:6px;padding:0 12px;font-size:13px;color:#202124;white-space:nowrap;overflow:hidden}
.url .ph{color:#80868b}
.url .lk{font-size:11px;color:#5f6368}
.ntp{position:absolute;left:0;right:0;top:78px;bottom:0;display:flex;flex-direction:column;align-items:center;padding-top:110px;color:#9ca3af;font-size:13px;background:#fff}
.ntp .g{font-size:40px;margin-bottom:10px}
.menu{position:absolute;right:6px;top:30px;width:238px;background:#fff;border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.28);padding:6px 0;z-index:6}
.menu div{padding:10px 16px;font-size:13px;display:flex;gap:12px;align-items:center;border-radius:6px}
.menu hr{border:0;border-top:1px solid #eee;margin:4px 0}
.menu .mi{width:18px;text-align:center;color:#5f6368}
.dim{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:5}
.dlg{position:absolute;z-index:7;background:#fff;border-radius:22px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.dlg h4{font-size:17px;font-weight:600;margin-bottom:14px}
.dlg .row{display:flex;gap:12px;align-items:center;margin-bottom:18px}
.dlg .row .ii{width:44px;height:44px;border-radius:50%;overflow:hidden;flex:none}
.dlg .row b{display:block;font-size:14px}.dlg .row span{font-size:12px;color:#5f6368}
.dlg .acts{display:flex;justify-content:flex-end;gap:6px}
.dlg .acts div{padding:9px 14px;border-radius:999px;font-weight:600;color:#1a73e8;font-size:13.5px}
.dlg .acts div.pri{background:#1a73e8;color:#fff}
/* Safari iPhone */
.sfb{position:absolute;left:0;right:0;bottom:0;height:104px;background:#f2f2f7;border-top:1px solid #d1d1d6;z-index:2}
.sfb .url{position:absolute;left:12px;right:12px;top:10px;height:40px;border-radius:12px;background:#fff;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.sfb .tools{position:absolute;left:0;right:0;top:58px;height:36px;display:flex;justify-content:space-around;align-items:center;color:#007aff;font-size:20px}
.sfb .tools div{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:10px}
.sheet{position:absolute;left:0;right:0;bottom:0;top:150px;background:#f2f2f7;border-radius:14px 14px 0 0;z-index:7;padding:14px 14px 0}
.sheet .hd{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.sheet .hd .ii{width:42px;height:42px;border-radius:10px;overflow:hidden}
.sheet .hd b{display:block;font-size:13.5px}.sheet .hd span{font-size:11.5px;color:#8e8e93}
.sheet .hd .x{margin-left:auto;width:26px;height:26px;border-radius:50%;background:#e5e5ea;display:flex;align-items:center;justify-content:center;color:#8e8e93;font-size:13px}
.sheet .ppl{display:flex;gap:14px;margin-bottom:12px;padding:0 2px}
.sheet .ppl div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:#3a3a3c}
.sheet .ppl i{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:22px;background:#fff}
.grp{background:#fff;border-radius:12px;margin-bottom:10px;overflow:hidden}
.grp div{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;font-size:13.5px;border-bottom:1px solid #e5e5ea}
.grp div:last-child{border-bottom:0}
.grp div span{font-size:16px;color:#3a3a3c}
.grp .hl,.menu .hl{outline-offset:-3px}
.addp{position:absolute;left:0;right:0;bottom:0;top:40px;background:#f2f2f7;border-radius:14px 14px 0 0;z-index:7;padding:0 14px}
.addp .nb{display:flex;justify-content:space-between;align-items:center;height:48px;font-size:14px}
.addp .nb .l{color:#007aff}.addp .nb .r{color:#007aff;font-weight:700;padding:6px 8px;border-radius:8px}
.addp .nb b{font-size:14px}
.addp .card{background:#fff;border-radius:12px;padding:12px;display:flex;gap:12px;align-items:center;margin-top:8px}
.addp .card .ii{width:60px;height:60px;border-radius:14px;overflow:hidden;flex:none}
.addp .card .nm{border-bottom:1px solid #e5e5ea;padding:6px 0;font-size:15px}
.addp .card .u{font-size:12px;color:#8e8e93;padding-top:6px}
.addp .tg{background:#fff;border-radius:12px;padding:12px;margin-top:14px;display:flex;justify-content:space-between;align-items:center;font-size:14px}
.sw{width:46px;height:28px;border-radius:999px;background:#34c759;position:relative}
.sw::after{content:"";position:absolute;right:2px;top:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.addp .nt{font-size:12px;color:#8e8e93;padding:8px 4px;line-height:1.4}
/* PC Windows */
.desk{position:absolute;inset:0;background:linear-gradient(135deg,#1e3a8a 0%,#2563eb 50%,#38bdf8 100%)}
.dicons{position:absolute;left:10px;top:10px;display:flex;flex-direction:column;gap:12px;z-index:1}
.dic{width:64px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 2px;border-radius:6px}
.dic i{width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:24px;border-radius:8px;overflow:hidden}
.dic span{font-size:9.5px;color:#fff;text-align:center;text-shadow:0 1px 2px rgba(0,0,0,.6);line-height:1.1}
.dic.new{animation:pop .7s ease}
.task-b{position:absolute;left:0;right:0;bottom:0;height:34px;background:rgba(241,245,249,.88);display:flex;align-items:center;justify-content:center;gap:10px;z-index:4}
.task-b div{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:15px;overflow:hidden}
.task-b .clk{position:absolute;right:10px;font-size:9.5px;text-align:right;line-height:1.2;width:auto;color:#111}
.win{position:absolute;left:84px;top:16px;width:540px;height:322px;background:#fff;border-radius:8px;box-shadow:0 12px 34px rgba(0,0,0,.35);overflow:hidden;z-index:2}
.win .tbar{height:30px;background:#dee1e6;display:flex;align-items:flex-end;padding:0 0 0 8px;position:relative}
.win .tbar.edge{background:#f3f3f3}
.win .tab{height:24px;background:#fff;border-radius:8px 8px 0 0;padding:0 10px;display:flex;align-items:center;gap:6px;font-size:10.5px;min-width:150px}
.win .tab .ti{width:14px;height:14px;border-radius:3px;overflow:hidden}
.win .wc{position:absolute;right:0;top:0;height:30px;display:flex}
.win .wc span{width:36px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#333}
.win .abar{height:34px;display:flex;align-items:center;gap:6px;padding:0 8px;border-bottom:1px solid #e5e7eb}
.win .abar .nv{font-size:13px;color:#5f6368;width:18px;text-align:center}
.win .abar .url{height:26px;font-size:11.5px;padding:0 6px 0 12px}
.win .abar .url .sp{flex:1}
.ibtn{width:24px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:6px;color:#3c4043}
.win .pg{position:absolute;left:0;right:0;top:64px;bottom:0}
.win.solo .pg{top:30px}
.win.solo .tbar{align-items:center;gap:8px;font-size:11px;background:#1e40af;color:#fff;padding-left:10px}
.win.solo .tbar .ti{width:16px;height:16px;border-radius:4px;overflow:hidden}
.win.solo .wc span{color:#fff}
.pop{position:absolute;z-index:8;background:#fff;border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.3);padding:14px;width:250px}
.pop h4{font-size:13px;font-weight:600;margin-bottom:10px}
.pop .row{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.pop .row .ii{width:32px;height:32px;border-radius:8px;overflow:hidden;flex:none}
.pop .row b{display:block;font-size:12px}.pop .row span{font-size:10.5px;color:#5f6368}
.pop .acts{display:flex;justify-content:flex-end;gap:6px}
.pop .acts div{padding:6px 12px;border-radius:999px;font-size:11.5px;font-weight:600;border:1px solid #dadce0;color:#1a73e8}
.pop .acts div.pri{background:#1a73e8;border-color:#1a73e8;color:#fff}
.pop.edge .acts div{border-radius:4px}
.pop.edge .acts div.pri{background:#0f6cbd;border-color:#0f6cbd}
.pop .ck{display:flex;gap:8px;align-items:center;font-size:11.5px;padding:5px 4px;border-radius:6px}
.pop .ck i{width:15px;height:15px;border:1.5px solid #616161;border-radius:3px;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:10px;color:#fff;flex:none}
.pop .ck i.on{background:#0f6cbd;border-color:#0f6cbd}
/* mano / puntero */
.hand{position:absolute;z-index:50;font-size:34px;left:300px;top:700px;transition:left .5s cubic-bezier(.4,.1,.2,1),top .5s cubic-bezier(.4,.1,.2,1);pointer-events:none;filter:drop-shadow(0 3px 4px rgba(0,0,0,.35));transform:translate(-30%,-8%)}
.hand.ptr{transform:none;font-size:0;line-height:0}
.hand.tap{animation:tap .45s ease}
.hand.ptr.tap{animation:click .45s ease}
@keyframes tap{50%{transform:translate(-30%,-8%) scale(.82)}}
@keyframes click{50%{transform:scale(.85)}}
.rip{position:absolute;z-index:49;width:16px;height:16px;border-radius:50%;background:rgba(37,99,235,.45);pointer-events:none;animation:rip .6s ease-out forwards}
@keyframes rip{to{transform:scale(4.5);opacity:0}}
.hl{outline:3px solid #f59e0b;outline-offset:2px;animation:glow 1.2s ease-in-out infinite}
@keyframes glow{50%{outline-color:#fcd34d}}
.caret::after{content:"|";animation:blink .8s steps(1) infinite;color:var(--blue)}
@keyframes blink{50%{opacity:0}}
@keyframes fin{from{opacity:.55}to{opacity:1}}
.app.fade{animation:fin .22s ease-out}
</style>
</head>
<body>
<div class="top">
  <div class="logo">ADEX</div>
  <div class="ttl" id="topTtl">Instalar ADEX</div>
  <div class="lang"><button data-l="es" class="on">ES</button><button data-l="pt">PT</button></div>
</div>

<main id="menu"></main>

<section id="player">
  <div class="pbar"><button class="back" id="bBack">‹ <span id="bBackT">Menú</span></button><div class="name" id="pName"></div></div>
  <div class="stagewrap"><div class="stage" id="stage"><div class="app" id="app"></div></div></div>

 ['No me aparece «Instalar app» ni el ícono de instalar.','Não aparece «Instalar app» nem o ícone de instalar.',
  'Espera a que la página de ADEX <b>cargue completa</b> (que veas la pantalla de entrada) y vuelve a abrir el menú. Si sigue sin salir, recarga la página. Asegúrate de usar <b>Chrome</b> o <b>Edge</b> en Android y en el computador, y <b>Safari</b> en iPhone. Si ADEX <b>ya está instalada</b>, la opción no aparece: busca el ícono.',
  'Espere a página do ADEX <b>carregar por completo</b> (até ver a tela de entrada) e abra o menu de novo. Se continuar sem aparecer, recarregue a página. Use <b>Chrome</b> ou <b>Edge</b> no Android e no computador, e <b>Safari</b> no iPhone. Se o ADEX <b>já estiver instalado</b>, a opção não aparece: procure o ícone.'],
 ['En iPhone no encuentro el botón Compartir.','No iPhone não encontro o botão Compartilhar.',
  'Es el <b>cuadrito con una flecha hacia arriba</b>. En las versiones nuevas de iPhone puede estar escondido: toca los <b>tres puntos (···)</b> junto a la dirección y luego <b>Compartir</b>. Si no ves «Agregar a pantalla de inicio», <b>desliza la lista hacia arriba</b>: suele estar más abajo.',
  'É o <b>quadradinho com uma seta para cima</b>. Nas versões novas do iPhone ele pode estar escondido: toque nos <b>três pontos (···)</b> ao lado do endereço e depois em <b>Compartilhar</b>. Se não vir «Adicionar à Tela de Início», <b>deslize a lista para cima</b>: costuma estar mais abaixo.'],
 ['En el computador no quedó el ícono en el escritorio.','No computador o ícone não ficou na área de trabalho.',
  'ADEX igual quedó instalada: búscala en el <b>menú Inicio</b> de Windows escribiendo «ADEX». Para ponerla en el escritorio, en Chrome escribe <code>chrome://apps</code> en la barra de direcciones, haz <b>clic derecho</b> sobre ADEX y elige <b>«Crear accesos directos…»</b> → <b>Escritorio</b>. En Edge, abre ADEX, toca los <b>tres puntos (···)</b> de su ventana y busca la opción de <b>crear acceso directo en el escritorio</b>.',
  'O ADEX foi instalado mesmo assim: procure no <b>menu Iniciar</b> do Windows digitando «ADEX». Para colocar na área de trabalho, no Chrome digite <code>chrome://apps</code> na barra de endereço, clique com o <b>botão direito</b> no ADEX e escolha <b>«Criar atalhos…»</b> → <b>Área de trabalho</b>. No Edge, abra o ADEX, clique nos <b>três pontos (···)</b> da janela e procure a opção de <b>criar atalho na área de trabalho</b>.'],
 ['¿Tengo que volver a entrar con mi usuario?','Preciso entrar de novo com o meu usuário?',
  'Sí, <b>la primera vez</b> que abras ADEX desde el ícono escribe tu usuario y contraseña de siempre. No es una cuenta nueva.',
  'Sim, <b>na primeira vez</b> que abrir o ADEX pelo ícone digite o seu usuário e senha de sempre. Não é uma conta nova.'],
 ['¿Cómo se actualiza?','Como ele é atualizado?',
  '<b>Sola.</b> Cuando hay una versión nueva, ADEX la descarga al abrirla con internet. Nunca hay que desinstalar ni volver a instalar.',
  '<b>Sozinho.</b> Quando há uma versão nova, o ADEX baixa ao abrir com internet. Nunca precisa desinstalar nem instalar de novo.'],
 ['¿Cómo la quito si ya no la quiero?','Como removo se não quiser mais?',
  'En el celular, <b>mantén presionado</b> el ícono de ADEX y elige <b>Desinstalar</b> (Android) o <b>Eliminar app</b> (iPhone). En el computador, abre ADEX, toca los <b>tres puntos</b> de su ventana y elige <b>Desinstalar</b>. Tus datos no se pierden: están guardados en ADEX, no en el equipo.',
  'No celular, <b>mantenha pressionado</b> o ícone do ADEX e escolha <b>Desinstalar</b> (Android) ou <b>Remover app</b> (iPhone). No computador, abra o ADEX, clique nos <b>três pontos</b> da janela e escolha <b>Desinstalar</b>. Os seus dados não se perdem: ficam guardados no ADEX, não no aparelho.']
];

/* ===================== MOTOR ===================== */
var $=function(id){return document.getElementById(id);};
var app=$('app'),stage=$('stage'),menu=$('menu'),player=$('player');
var mode=null,task=null,idx=0,playing=true,timer=null,typer=null,scale=1,last=null;

function fit(){
  if(!task)return;
  var W=task.w,Hh=task.h,wide=W>400;
  player.classList.toggle('wide',wide);
  app.style.width=W+'px';app.style.height=Hh+'px';
  var wrapW=Math.min(player.clientWidth-16,wide?760:420);
  var used=$('cap').offsetHeight+player.querySelector('.pbar').offsetHeight+14;
  var availH=window.innerHeight-52-used;
  if(window.innerWidth>=900&&!wide) availH=window.innerHeight-52-player.querySelector('.pbar').offsetHeight-30;
  scale=Math.max(0.35,Math.min(wrapW/W,availH/Hh,wide?1.2:1.25));
  app.style.transform='scale('+scale+')';
  stage.style.width=(W*scale)+'px';stage.style.height=(Hh*scale)+'px';
}
function renderMenu(){
  document.documentElement.lang=LANG==='pt'?'pt-BR':'es';
  $('topTtl').textContent=T('title');document.title=T('title')+' · Manual';
  var h='<div class="hero"><img src="'+ICON+'" alt="ADEX"><div><h1>'+T('heroH')+'</h1><p>'+T('heroP')+'</p></div></div>';
  h+='<div class="open"><a class="go" href="https://'+URL_APP+'/" target="_blank" rel="noopener">🚀 '+T('openB')+'</a><div class="addr">'+T('addr')+' <b>'+URL_APP+'</b></div><div class="wa">'+T('wa')+'</div></div>';
  h+='<div class="sec">📲 '+T('where')+' <small>'+T('whereS')+'</small></div><div class="grid">';
  TASKS.forEach(function(t,i){h+='<button class="task" data-task="'+i+'"><span class="ic">'+t.ic+'</span><b>'+t[LANG][0]+'</b><span>'+t[LANG][1]+'</span></button>';});
  h+='</div><div class="sec">✨ '+T('gainH')+'</div><ul class="gain">'+T('gain').map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul>';
  h+='<div class="sec">🛟 '+T('faqH')+'</div><div class="faq">';
  FAQ.forEach(function(f){var p=LANG==='pt';h+='<details><summary>'+(p?f[1]:f[0])+'</summary><div class="ans">'+(p?f[3]:f[2])+'</div></details>';});
  h+='</div><div class="tip">'+T('tip')+'</div>';
  menu.innerHTML=h;
  $('bBackT').textContent=T('menu');
}
menu.addEventListener('click',function(e){var b=e.target.closest('[data-task]');if(b)openTask(+b.dataset.task);});
function showPlayer(){menu.style.display='none';player.classList.add('on');window.scrollTo(0,0);}
function toMenu(){stop();mode=null;player.classList.remove('on');menu.style.display='';app.innerHTML='';}
$('bBack').onclick=toMenu;

function stop(){clearTimeout(timer);clearInterval(typer);timer=null;typer=null;}
function openTask(i){
  last=null;mode='task';task=TASKS[i];idx=0;playing=true;
  $('pName').textContent=task.ic+' '+task[LANG][0];
  stage.style.borderRadius=task.pc?'10px':'18px';
  showPlayer();fit();runStep();
}
var PTR='<svg width="22" height="26" viewBox="0 0 22 26"><path d="M2 2l0 19 5-5 3.5 8 3-1.3-3.5-7.7 7 0z" fill="#fff" stroke="#111" stroke-width="1.5" stroke-linejoin="round"/></svg>';
function drawScreen(s,st){
  var hp=last?' style="left:'+last.x+'px;top:'+last.y+'px"':'';
  app.innerHTML=S[s](JSON.parse(JSON.stringify(st||{})))+'<div class="hand'+(task.pc?' ptr':'')+'" id="hand"'+hp+'>'+(task.pc?PTR:'👆')+'</div>';
  app.classList.remove('fade');void app.offsetWidth;app.classList.add('fade');
}
function el(t){return app.querySelector('[data-t="'+t+'"]');}
function pos(node){
  var r=node.getBoundingClientRect(),a=app.getBoundingClientRect();
  return {x:(r.left-a.left+r.width/2)/scale,y:(r.top-a.top+r.height/2)/scale};
}
function runStep(){
  stop();
  var st=task.steps[idx];
  var txt=st[LANG];
  drawScreen(st.s,st.st);
  var n=task.steps.length;
  $('prog').innerHTML=task.steps.map(function(_,k){return '<i class="'+(k<idx?'pd':k===idx?'pc':'')+'"></i>';}).join('');
  $('stepn').textContent=T('step').replace('{a}',idx+1).replace('{b}',n);
  $('txt').innerHTML=txt;
  $('bPlay').textContent=playing?T('pause'):T('play');
  fit();
  var hand=$('hand');
  var target=st.t?el(st.t):null;
  var extra=0;
  if(target){
    var p=pos(target);
    if(task.pc){p.x-=4;p.y-=2;}
    var near=last&&Math.abs(last.x-p.x)<4&&Math.abs(last.y-p.y)<4;
    var wait=near?150:550;
    last=p;
    requestAnimationFrame(function(){hand.style.left=p.x+'px';hand.style.top=p.y+'px';});
    setTimeout(function(){
      if(mode!=='task')return;
      target.classList.add('hl');
      if(st.a==='tap'){
        hand.classList.add('tap');
        var rp=document.createElement('div');rp.className='rip';rp.style.left=(p.x-8)+'px';rp.style.top=(p.y-8)+'px';app.appendChild(rp);
      }
      if(st.a==='type'){
        var v=target.querySelector('.v');var ph=target.querySelector('.ph');if(ph)ph.remove();
        if(v){var full=st.v,k=0;v.textContent='';v.classList.add('caret');
          typer=setInterval(function(){k++;v.textContent=full.slice(0,k);if(k>=full.length){clearInterval(typer);typer=null;v.classList.remove('caret');}},50);}
      }
    },wait);
    if(st.a==='type')extra=st.v.length*50;
    extra+=wait;
    if(!st.a)hand.style.display='none';
  } else {hand.style.display='none';}
  /* el paso termina poco después de la acción; solo los textos largos dan algo más de tiempo para leer */
  var chars=txt.replace(/<[^>]+>/g,'').length;
  var dur=st.a?Math.max(extra+1300,chars*26):Math.max(2000,chars*28)+(target?extra:0);
  if(playing)timer=setTimeout(next,dur);
}
function next(){if(idx<task.steps.length-1){idx++;runStep();}else finish();}
function prev(){if(idx>0){idx--;runStep();}else runStep();}
function finish(){
  stop();
  var d=document.createElement('div');d.className='done';
  d.innerHTML='<div><div class="big">🎉</div><h3>'+T('doneH')+'</h3><p>'+T('doneP')+'</p><button class="main" id="dAgain">'+T('again')+'</button><button id="dMenu">'+T('toMenu')+'</button></div>';
  stage.appendChild(d);
  $('dAgain').onclick=function(){d.remove();idx=0;playing=true;runStep();};
  $('dMenu').onclick=function(){d.remove();toMenu();};
}
function clearDone(){var d=stage.querySelector('.done');if(d)d.remove();}
$('bNext').onclick=function(){clearDone();next();};
$('bPrev').onclick=function(){clearDone();prev();};
$('bAgain').onclick=function(){clearDone();idx=0;playing=true;runStep();};
$('bPlay').onclick=function(){clearDone();playing=!playing;if(playing){runStep();}else{stop();$('bPlay').textContent=T('play');}};

/* ---- idioma ---- */
document.querySelectorAll('.lang button').forEach(function(b){
  b.onclick=function(){
    LANG=b.dataset.l;try{localStorage.setItem('adexManualLang',LANG);}catch(e){}
    document.querySelectorAll('.lang button').forEach(function(x){x.classList.toggle('on',x.dataset.l===LANG);});
    renderMenu();
    if(mode==='task'){$('pName').textContent=task.ic+' '+task[LANG][0];runStep();}
  };
  b.classList.toggle('on',b.dataset.l===LANG);
});
window.addEventListener('resize',function(){if(mode)fit();});
renderMenu();
window.__manual={TASKS:TASKS,S:S};
})();
</script>
