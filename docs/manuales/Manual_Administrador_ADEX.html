<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Manual del Administrador · ADEX</title>
<style>
:root{
  --blue:#2563eb;--blue2:#1d4ed8;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--bg:#f1f5f9;--card:#fff;
  --green:#059669;--red:#dc2626;--amber:#d97706;--soft:#eff6ff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 16px;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff}
.top .logo{font-weight:900;font-size:20px;letter-spacing:1px}
.top .ttl{font-size:14px;opacity:.9;flex:1;line-height:1.2}
.lang{display:flex;background:rgba(255,255,255,.18);border-radius:999px;padding:3px}
.lang button{padding:5px 11px;border-radius:999px;font-weight:700;font-size:13px;color:#fff}
.lang button.on{background:#fff;color:var(--blue)}
/* ---------- MENÚ ---------- */
#menu{max-width:720px;margin:0 auto;padding:16px 16px 40px}
.hero{background:#fff;border-radius:20px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:16px}
.hero h1{font-size:22px;margin-bottom:6px}
.hero p{color:var(--mut);font-size:15px;line-height:1.45}
.sec{margin:22px 0 10px;font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px}
.sec small{font-weight:500;color:var(--mut);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.task{background:#fff;border-radius:16px;padding:14px;text-align:left;box-shadow:0 1px 3px rgba(0,0,0,.06);border:2px solid transparent;display:flex;flex-direction:column;gap:6px;min-height:104px}
.task:active,.task:hover{border-color:var(--blue)}
.task .ic{font-size:28px}
.task b{font-size:15px;line-height:1.25}
.task span{font-size:12.5px;color:var(--mut);line-height:1.3}
.tip{background:#fffbeb;border:1px solid #fde68a;border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.45;margin-top:14px}
/* ---------- REPRODUCTOR ---------- */
#player{display:none;flex-direction:column;height:calc(100dvh - 52px);max-width:720px;margin:0 auto}
#player.on{display:flex}
.pbar{display:flex;align-items:center;gap:8px;padding:8px 12px}
.pbar .back{background:#fff;border-radius:999px;padding:7px 12px;font-weight:700;font-size:14px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.pbar .name{font-weight:800;font-size:15px;flex:1;line-height:1.2}
.stagewrap{flex:1;min-height:0;display:flex;justify-content:center;align-items:flex-start;padding:0 8px}
.stage{position:relative;border-radius:18px;overflow:hidden;box-shadow:0 8px 30px rgba(15,23,42,.18);background:#000}
.cap{background:#fff;border-radius:18px 18px 0 0;padding:12px 16px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(0,0,0,.06)}
.prog{display:flex;gap:4px;margin-bottom:8px}
.prog i{flex:1;height:5px;border-radius:9px;background:var(--line)}
.prog i.pd{background:#93c5fd}.prog i.pc{background:var(--blue)}
.stepn{font-size:12px;color:var(--mut);font-weight:700;margin-bottom:3px}
.txt{font-size:16.5px;line-height:1.42;min-height:3.2em}
.txt b{color:var(--blue2)}
.ctrls{display:flex;gap:8px;margin-top:10px}
.ctrls button{flex:1;padding:11px 6px;border-radius:12px;background:var(--soft);color:var(--blue2);font-weight:800;font-size:15px}
.ctrls button.main{background:var(--blue);color:#fff;flex:1.4}
.done{position:absolute;inset:0;z-index:40;background:rgba(15,23,42,.72);display:flex;align-items:center;justify-content:center;padding:24px}
.done div{background:#fff;border-radius:20px;padding:22px;text-align:center;max-width:300px}
.done .big{font-size:46px}
.done h3{margin:6px 0 8px;font-size:20px}
.done p{color:var(--mut);font-size:15px;line-height:1.4;margin-bottom:14px}
.done button{display:block;width:100%;padding:12px;border-radius:12px;font-weight:800;margin-top:8px;background:var(--soft);color:var(--blue2)}
.done button.main{background:var(--blue);color:#fff}
/* explorar */
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 12px 8px}
.chips button{white-space:nowrap;padding:7px 12px;border-radius:999px;background:#fff;font-weight:700;font-size:13.5px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chips button.on{background:var(--blue);color:#fff}
.badge{position:absolute;z-index:30;width:22px;height:22px;border-radius:50%;background:#f59e0b;color:#fff;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px #fff;pointer-events:none;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:scale(1.15)}}
.explore [data-h]{cursor:pointer}
.picked{outline:3px solid #f59e0b!important;outline-offset:2px;border-radius:10px}

/* ================= APP SIMULADA (360 x 640) ================= */
.app{position:absolute;left:0;top:0;width:360px;height:640px;transform-origin:0 0;background:#f8fafc;overflow:hidden;font-size:13px;color:#111827}
.app *{transition:none}
.hdr{position:absolute;left:0;right:0;top:0;height:54px;background:var(--blue);color:#fff;display:flex;align-items:center;gap:8px;padding:0 10px}
.hdr .lg{font-weight:900;font-size:17px;font-style:italic;letter-spacing:.5px;line-height:.9}
.hdr .lg small{display:block;font-size:6px;letter-spacing:2px;font-style:normal;font-weight:600}
.hdr .who{flex:1;line-height:1.15}.hdr .who b{font-size:13px;display:block}.hdr .who span{font-size:11px;opacity:.9}
.net{font-size:10.5px;font-weight:700;padding:4px 8px;border-radius:999px;background:rgba(255,255,255,.2)}
.net.off{background:#f59e0b}
.hico{width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:15px}
.scr{position:absolute;left:0;right:0;top:54px;bottom:58px;overflow-y:auto;padding:12px;scroll-behavior:smooth}
.scr.full{top:0;bottom:0}
.scr.nonav{bottom:0}
.nav{position:absolute;left:0;right:0;bottom:0;height:58px;background:#fff;border-top:1px solid var(--line);display:flex}
.nav div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9.5px;color:#9ca3af;gap:2px}
.nav div i{font-style:normal;font-size:16px;filter:grayscale(1);opacity:.7}
.nav div.on{color:var(--blue)}.nav div.on i{filter:none;opacity:1}
.c{background:#fff;border-radius:16px;border:1px solid #eef2f7;box-shadow:0 1px 2px rgba(0,0,0,.04);padding:12px;margin-bottom:10px}
.greet{background:linear-gradient(135deg,#2563eb,#1e40af);color:#fff;border-radius:18px;padding:14px;margin-bottom:10px}
.greet small{opacity:.85;font-size:12px}.greet b{display:block;font-size:19px;margin:2px 0 8px}
.greet .row{display:flex;justify-content:space-between;align-items:center;font-size:11.5px}
.pill{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.18);padding:4px 9px;border-radius:999px;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:10px}
.stats div{border-radius:13px;padding:9px 4px;text-align:center;border:1px solid}
.stats b{display:block;font-size:15px}.stats span{font-size:10.5px;color:#374151}
.s1{background:#fffbeb;border-color:#fde68a!important}.s1 b{color:#d97706}
.s2{background:#ecfdf5;border-color:#a7f3d0!important}.s2 b{color:#059669}
.s3{background:#eff6ff;border-color:#bfdbfe!important}.s3 b{color:#2563eb}
.mod{display:flex;gap:10px;align-items:flex-start}
.mod .mi{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.mod b{font-size:14px;display:block}.mod span{font-size:11.5px;color:#6b7280}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.b{display:inline-flex;align-items:center;justify-content:center;padding:7px 11px;border-radius:10px;border:1px solid #e5e7eb;background:#f9fafb;font-weight:600;font-size:11.5px}
.b.pri{background:var(--blue);color:#fff;border-color:var(--blue)}
.b.grn{background:#059669;color:#fff;border-color:#059669}
.b.full{display:flex;width:100%;padding:11px;font-size:13px;margin-top:8px}
.b.out{background:#fff}
.h1{font-weight:800;font-size:16px}.sub{font-size:11.5px;color:#6b7280;margin-bottom:10px}
.back{font-size:12px;color:var(--blue);font-weight:700;margin-bottom:6px}
.f{margin-bottom:9px}
.f label{display:block;font-size:11px;font-weight:700;color:#374151;margin-bottom:3px}
.inp{border:1.5px solid #d1d5db;border-radius:10px;padding:8px 10px;background:#fff;min-height:35px;font-size:13px;display:flex;align-items:center;gap:6px}
.inp .v{flex:1;white-space:nowrap;overflow:hidden}
.inp .ph{color:#9ca3af}
.inp .v:empty{flex:0}
.inp.dis{background:#f3f4f6;color:#6b7280}
.sel::after{content:"▾";color:#9ca3af}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tabs{display:flex;gap:5px;margin-bottom:8px;overflow:hidden}
.tabs div{padding:6px 8px;border-radius:999px;background:#fff;border:1px solid #e5e7eb;font-size:10.5px;font-weight:700;white-space:nowrap}
.tabs div.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.cl .top2{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.cl b{font-size:13.5px}.cl .ad{font-size:11px;color:#6b7280}
.tag{font-size:10px;font-weight:700;padding:3px 7px;border-radius:999px;white-space:nowrap}
.t-ok{background:#d1fae5;color:#047857}.t-w{background:#fef3c7;color:#b45309}.t-r{background:#fee2e2;color:#b91c1c}.t-g{background:#f3f4f6;color:#4b5563}.t-b{background:#dbeafe;color:#1d4ed8}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0;text-align:center}
.kv div{background:#f9fafb;border-radius:9px;padding:6px 2px}
.kv span{display:block;font-size:10px;color:#6b7280}.kv b{font-size:12px}
.days{font-size:10.5px;color:#6b7280}
.quick{display:flex;gap:5px;margin:6px 0 9px}
.quick div{flex:1;text-align:center;padding:7px 2px;border-radius:9px;border:1px solid #bfdbfe;background:#eff6ff;color:#1d4ed8;font-size:11px;font-weight:700}
.sum{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:12px;padding:9px 11px;margin-bottom:8px;font-size:12px}
.sum div{display:flex;justify-content:space-between;padding:2px 0}
.note{font-size:10.5px;color:#6b7280;background:#f9fafb;border-radius:9px;padding:7px 9px;margin-bottom:6px}
.ok{text-align:center;padding:40px 16px}
.ok .circ{width:70px;height:70px;border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:34px;color:#fff}
.ok h2{font-size:18px;margin-bottom:6px}.ok p{font-size:12.5px;color:#4b5563;line-height:1.4}
.chiprow{display:flex;flex-wrap:wrap;gap:6px}
.chiprow div{padding:7px 10px;border-radius:999px;border:1px solid #e5e7eb;background:#fff;font-size:11.5px;font-weight:600}
.chiprow div.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.ph-box{border:1.5px dashed #cbd5e1;border-radius:12px;padding:12px;text-align:center;font-size:11px;color:#6b7280;background:#fff}
.tog{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sw{width:38px;height:22px;border-radius:99px;background:#d1d5db;position:relative;flex:none}
.sw::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:2px;left:2px}
.sw.on{background:var(--blue)}.sw.on::after{left:18px}
.toast{position:absolute;left:12px;right:12px;bottom:70px;background:#065f46;color:#fff;border-radius:12px;padding:10px 12px;font-size:12px;font-weight:600;z-index:15;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.mv{display:flex;justify-content:space-between;align-items:center;padding:9px 2px;border-bottom:1px solid #f3f4f6}
.mv:last-child{border:0}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:8px}
.row2{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f3f4f6;font-size:12px}
.row2:last-child{border:0}
.drop{border:1px solid #e5e7eb;border-radius:10px;background:#fff;margin-top:3px;box-shadow:0 4px 12px rgba(0,0,0,.08)}
.drop div{padding:8px 10px;font-size:12px;border-bottom:1px solid #f3f4f6}
.login{position:absolute;inset:0;background:linear-gradient(160deg,#1e3a8a,#2563eb);padding:40px 18px}
.login .brand{color:#fff;text-align:center;margin-bottom:22px}
.login .brand b{font-size:34px;font-style:italic;font-weight:900;letter-spacing:1px}
.login .brand span{display:block;font-size:12px;opacity:.85}
/* mano y resaltado */
.hand{position:absolute;z-index:50;font-size:34px;left:300px;top:700px;transition:left .75s cubic-bezier(.4,.1,.2,1),top .75s cubic-bezier(.4,.1,.2,1);pointer-events:none;filter:drop-shadow(0 3px 4px rgba(0,0,0,.35));transform:translate(-30%,-8%)}
.hand.tap{animation:tap .45s ease}
@keyframes tap{50%{transform:translate(-30%,-8%) scale(.82)}}
.rip{position:absolute;z-index:49;width:16px;height:16px;border-radius:50%;background:rgba(37,99,235,.45);pointer-events:none;animation:rip .6s ease-out forwards}
@keyframes rip{to{transform:scale(4.5);opacity:0}}
.hl{outline:3px solid #f59e0b;outline-offset:2px;border-radius:10px;animation:glow 1.2s ease-in-out infinite}
@keyframes glow{50%{outline-color:#fcd34d}}
.caret::after{content:"|";animation:blink .8s steps(1) infinite;color:var(--blue)}
@keyframes blink{50%{opacity:0}}
@media (min-width:900px){
  #player{flex-direction:row;flex-wrap:wrap;align-content:flex-start;max-width:900px}
  .pbar,.chips{width:100%}
  .stagewrap{flex:0 0 auto;padding:0 16px}
  .cap{flex:1;border-radius:18px;margin-right:16px;align-self:flex-start}
}

/* ---- Admin ---- */
.ahdr{position:absolute;left:0;right:0;top:0;height:54px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 10px}
.ahdr .aco{flex:1;font-size:13px;font-weight:600;color:#4b5563}
.wifi{font-size:11px;padding:4px 8px;border-radius:999px;background:#ecfdf5}
.avat{width:30px;height:30px;border-radius:50%;background:#dbeafe;color:#1d4ed8;font-weight:800;font-size:11px;display:flex;align-items:center;justify-content:center}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.dk{background:#fff;border:1px solid #eef2f7;border-radius:14px;padding:9px 10px}
.dk span{display:block;font-size:10.5px;color:#6b7280}.dk b{display:block;font-size:14.5px;margin-top:2px}.dk small{display:block;font-size:9.5px;color:#9ca3af;margin-top:2px;line-height:1.2}
.bars{display:flex;align-items:flex-end;gap:6px;height:70px;margin-top:8px}.bars i{flex:1;background:#93c5fd;border-radius:5px 5px 0 0}
.shade{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:20}
.drw{position:absolute;left:0;top:0;bottom:0;width:250px;background:#1e40af;color:#fff;z-index:21;padding:12px 10px;overflow-y:auto}
.dlogo{font-weight:900;font-style:italic;font-size:20px;padding:4px 8px 10px}.dlogo small{display:block;font-size:10px;font-style:normal;font-weight:600;opacity:.7}
.dg p{font-size:9.5px;letter-spacing:1.2px;color:#93c5fd;font-weight:700;padding:8px 8px 3px}
.di{display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:10px;font-size:13px;color:#dbeafe}
.di i{font-style:normal;display:flex}.di.on{background:#2563eb;color:#fff;font-weight:700}
.dco{background:rgba(30,58,138,.7);border-radius:12px;padding:8px 10px;margin-bottom:6px}.dco b{display:block;font-size:12.5px}.dco span{font-size:11px;color:#93c5fd}
.duser{display:flex;gap:8px;align-items:center;border-top:1px solid rgba(255,255,255,.15);margin-top:10px;padding:10px 6px 4px}.duser b{display:block;font-size:12px}.duser span{font-size:11px;color:#9ca3af}
.tb{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.ul{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.ul b{font-size:13px}.ad{font-size:11px;color:#6b7280}
.modal{position:absolute;inset:0;background:rgba(15,23,42,.55);z-index:20;display:flex;align-items:flex-end}
.mbox{background:#fff;width:100%;max-height:88%;overflow-y:auto;border-radius:18px 18px 0 0;padding:14px}
.chk{display:flex;flex-wrap:wrap;gap:6px}.chk div{padding:7px 10px;border-radius:10px;border:1px solid #e5e7eb;background:#fff;font-size:11.5px}
.chk div.on{border-color:var(--blue);background:#eff6ff;color:#1d4ed8;font-weight:700}.chk.col{flex-direction:column}
.mt{display:flex;background:#e5e7eb;border-radius:11px;padding:3px;margin-bottom:10px}
.mt div{flex:1;text-align:center;padding:7px 4px;border-radius:9px;font-size:11.5px;font-weight:700;color:#4b5563}.mt div.on{background:#fff;color:#1d4ed8;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.pc{font-size:10.5px;padding:4px 7px;border-radius:8px;border:1px solid #e5e7eb;color:#6b7280}.pc.on{background:#ecfdf5;border-color:#a7f3d0;color:#047857;font-weight:700}
.ico{display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.lgi{height:34px;width:auto;display:block;margin-left:-4px}
</style>
</head>
<body>
<div class="top">
  <div class="logo">ADEX</div>
  <div class="ttl" id="topTtl">Manual del Administrador</div>
  <div class="lang"><button data-l="es" class="on">ES</button><button data-l="pt">PT</button></div>
</div>

<main id="menu"></main>

<section id="player">
  <div class="pbar"><button class="back" id="bBack">‹ <span id="bBackT">Menú</span></button><div class="name" id="pName"></div></div>
  <div class="chips" id="chips" style="display:none"></div>
  <div class="stagewrap"><div class="stage" id="stage"><div class="app" id="app"></div></div></div>
  <div class="cap" id="cap">
    <div class="prog" id="prog"></div>
    <div class="stepn" id="stepn"></div>
    <div class="txt" id="txt"></div>
    <div class="ctrls" id="ctrls">
      <button id="bPrev">◀</button>
      <button id="bPlay" class="main">⏸</button>
      <button id="bNext">▶</button>
      <button id="bAgain">⟲</button>
    </div>
  </div>
</section>

<script>

/* ===================== MOTOR ===================== */
var $=function(id){return document.getElementById(id);};
var app=$('app'),stage=$('stage'),menu=$('menu'),player=$('player');
var mode=null,task=null,idx=0,playing=true,timer=null,typer=null,scale=1,expKey='home';

function fit(){
  var wrapW=Math.min(player.clientWidth-16,420);
  var used=$('cap').offsetHeight+player.querySelector('.pbar').offsetHeight+($('chips').style.display==='none'?0:$('chips').offsetHeight)+14;
  var availH=window.innerHeight-52-used;
  if(window.innerWidth>=900) availH=window.innerHeight-52-player.querySelector('.pbar').offsetHeight-30;
  scale=Math.max(0.5,Math.min(wrapW/360,availH/640,1.25));
  app.style.transform='scale('+scale+')';
  stage.style.width=(360*scale)+'px';stage.style.height=(640*scale)+'px';
}
function renderMenu(){
  document.documentElement.lang=LANG==='pt'?'pt-BR':'es';
  $('topTtl').textContent=T('title');document.title=T('title')+' · ADEX';
  var h='<div class="hero"><h1>'+T('heroH')+'</h1><p>'+T('heroP')+'</p></div>';
  h+='<div class="sec">📘 '+T('how')+' <small>'+T('howS')+'</small></div><div class="grid">';
  TASKS.forEach(function(t,i){h+='<button class="task" data-task="'+i+'"><span class="ic">'+t.ic+'</span><b>'+t[LANG][0]+'</b><span>'+t[LANG][1]+'</span></button>';});
  h+='</div><div class="sec">🔎 '+T('what')+' <small>'+T('whatS')+'</small></div><div class="grid">';
  EXPLIST.map(function(x){return [x[0],x[1],LANG==='pt'?x[3]:x[2]];}).forEach(function(x){
    h+='<button class="task" data-exp="'+x[0]+'"><span class="ic">'+x[1]+'</span><b>'+x[2]+'</b></button>';});
  h+='</div><div class="tip">'+T('tip')+'</div>';
  menu.innerHTML=h;
  $('bBackT').textContent=T('menu');
}
menu.addEventListener('click',function(e){
  var b=e.target.closest('[data-task]');if(b){openTask(+b.dataset.task);return;}
  b=e.target.closest('[data-exp]');if(b){openExplore(b.dataset.exp);}
});
function showPlayer(){menu.style.display='none';player.classList.add('on');window.scrollTo(0,0);}
function toMenu(){stop();mode=null;player.classList.remove('on');menu.style.display='';app.innerHTML='';}
$('bBack').onclick=toMenu;

function stop(){clearTimeout(timer);clearInterval(typer);timer=null;typer=null;}
function openTask(i){
  mode='task';task=TASKS[i];idx=0;playing=true;
  $('pName').textContent=task.ic+' '+task[LANG][0];
  $('chips').style.display='none';$('ctrls').style.display='';$('prog').style.display='';
  showPlayer();fit();runStep();
}
function drawScreen(s,st){
  app.innerHTML=S[s](JSON.parse(JSON.stringify(st||{})))+'<div class="hand" id="hand">👆</div>';
}
function el(t){return app.querySelector('[data-t="'+t+'"]')||app.querySelector('[data-h="'+t+'"]');}
function bringIntoView(node){
  var scr=node.closest('.scr');if(!scr)return;
  var r=node.getBoundingClientRect(),sr=scr.getBoundingClientRect();
  var y=(r.top-sr.top)/scale+scr.scrollTop;
  var want=y-(scr.clientHeight/2)+(r.height/scale/2);
  scr.style.scrollBehavior='auto';
  scr.scrollTop=Math.max(0,want);
}
function pos(node){
  var r=node.getBoundingClientRect(),a=app.getBoundingClientRect();
  return {x:(r.left-a.left+r.width/2)/scale,y:(r.top-a.top+r.height/2)/scale};
}
function runStep(){
  stop();
  var st=task.steps[idx];
  drawScreen(st.s,st.st);
  var n=task.steps.length;
  $('prog').innerHTML=task.steps.map(function(_,k){return '<i class="'+(k<idx?'pd':k===idx?'pc':'')+'"></i>';}).join('');
  $('stepn').textContent=T('step').replace('{a}',idx+1).replace('{b}',n);
  $('txt').innerHTML=st[LANG];
  $('bPlay').textContent=playing?T('pause'):T('play');
  fit();
  var hand=$('hand');
  var target=st.t?el(st.t):null;
  var extra=0;
  if(target){
    bringIntoView(target);
    var p=pos(target);
    requestAnimationFrame(function(){hand.style.left=p.x+'px';hand.style.top=p.y+'px';});
    setTimeout(function(){
      if(mode!=='task')return;
      target.classList.add('hl');
      if(st.a==='tap'){
        hand.classList.add('tap');
        var rp=document.createElement('div');rp.className='rip';rp.style.left=(p.x-8)+'px';rp.style.top=(p.y-8)+'px';app.appendChild(rp);
      }
      if(st.a==='type'){
        var v=target.querySelector('.v');var ph=target.querySelector('.ph');if(ph)ph.remove();
        if(v){var full=st.v,k=0;v.textContent='';v.classList.add('caret');
          typer=setInterval(function(){k++;v.textContent=full.slice(0,k);if(k>=full.length){clearInterval(typer);typer=null;v.classList.remove('caret');}},85);}
      }
    },800);
    if(st.a==='type')extra=st.v.length*85;
  } else {hand.style.display='none';}
  var dur=Math.max(4200,st[LANG].replace(/<[^>]+>/g,'').length*62)+extra+(target?800:0);
  if(playing)timer=setTimeout(next,dur);
}
function next(){
  if(idx<task.steps.length-1){idx++;runStep();}
  else finish();
}
function prev(){if(idx>0){idx--;runStep();}else runStep();}
function finish(){
  stop();
  var d=document.createElement('div');d.className='done';
  d.innerHTML='<div><div class="big">🎉</div><h3>'+T('doneH')+'</h3><p>'+T('doneP')+'</p><button class="main" id="dAgain">'+T('again')+'</button><button id="dMenu">'+T('toMenu')+'</button></div>';
  stage.appendChild(d);
  $('dAgain').onclick=function(){d.remove();idx=0;playing=true;runStep();};
  $('dMenu').onclick=function(){d.remove();toMenu();};
}
function clearDone(){var d=stage.querySelector('.done');if(d)d.remove();}
$('bNext').onclick=function(){clearDone();next();};
$('bPrev').onclick=function(){clearDone();prev();};
$('bAgain').onclick=function(){clearDone();idx=0;playing=true;runStep();};
$('bPlay').onclick=function(){clearDone();playing=!playing;if(playing){runStep();}else{stop();$('bPlay').textContent=T('play');}};

/* ---- explorar ---- */
function openExplore(k){
  mode='exp';expKey=k;
  $('pName').textContent='🔎 '+T('what');
  var ch=$('chips');ch.style.display='flex';
  ch.innerHTML=EXPLIST.map(function(x){return [x[0],LANG==='pt'?x[3]:x[2]];}).map(function(x){return '<button data-k="'+x[0]+'" class="'+(x[0]===k?'on':'')+'">'+x[1]+'</button>';}).join('');
  $('ctrls').style.display='none';$('prog').style.display='none';$('stepn').textContent='';
  $('txt').innerHTML=T('expHint');
  showPlayer();
  var e=EXP[k];
  drawScreen(e.s,e.st);$('hand').style.display='none';
  app.classList.add('explore');
  fit();
  setTimeout(placeBadges,30);
}
$('chips').addEventListener('click',function(e){var b=e.target.closest('[data-k]');if(b)openExplore(b.dataset.k);});
function placeBadges(){
  app.querySelectorAll('.badge').forEach(function(b){b.remove();});
  var e=EXP[expKey];
  e.keys.forEach(function(key,i){
    var node=app.querySelector('[data-h="'+key+'"]');if(!node)return;
    var r=node.getBoundingClientRect(),a=app.getBoundingClientRect();
    var b=document.createElement('div');b.className='badge';b.textContent=i+1;
    var x=(r.right-a.left)/scale-16, y=(r.top-a.top)/scale-8;
    b.style.left=Math.max(2,Math.min(334,x))+'px';b.style.top=Math.max(2,Math.min(614,y))+'px';
    app.appendChild(b);
  });
}
app.addEventListener('click',function(e){
  if(mode!=='exp')return;
  var e2=EXP[expKey];
  var node=e.target.closest('[data-h]');
  while(node&&e2.keys.indexOf(node.dataset.h)<0){node=node.parentElement&&node.parentElement.closest('[data-h]');}
  if(!node)return;
  app.querySelectorAll('.picked').forEach(function(x){x.classList.remove('picked');});
  node.classList.add('picked');
  var n=e2.keys.indexOf(node.dataset.h)+1;
  $('txt').innerHTML='<span style="display:inline-flex;width:22px;height:22px;border-radius:50%;background:#f59e0b;color:#fff;font-weight:900;font-size:12px;align-items:center;justify-content:center;margin-right:6px">'+n+'</span>'+HELP[node.dataset.h][LANG==='pt'?1:0];
});
app.addEventListener('scroll',function(){if(mode==='exp')placeBadges();},true);

/* ---- idioma ---- */
document.querySelectorAll('.lang button').forEach(function(b){
  b.onclick=function(){
    LANG=b.dataset.l;try{localStorage.setItem('adexManualLang',LANG);}catch(e){}
    document.querySelectorAll('.lang button').forEach(function(x){x.classList.toggle('on',x.dataset.l===LANG);});
    renderMenu();
    if(mode==='task'){$('pName').textContent=task.ic+' '+task[LANG][0];runStep();}
    else if(mode==='exp'){openExplore(expKey);}
  };
  b.classList.toggle('on',b.dataset.l===LANG);
});
window.addEventListener('resize',function(){if(mode){fit();if(mode==='exp')placeBadges();}});
renderMenu();
window.__manual={TASKS:TASKS,S:S,EXP:EXP,HELP:HELP};
})();
</script>
</body>
